  .lgrow a{color:#2E7069 !important;}
  .lghint{background:#E1EFEC !important; border-color:#C8E0DA !important; color:#275F59 !important;}
  /* حقول وأزرار وبطاقات بمقاسات الهوية */
  input, select, textarea{min-height:44px; border-radius:12px; border-color:#D2CDC4;}
  .fbox input, .fbox select, .fbox textarea{min-height:22px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:#2E7069;
    box-shadow:0 0 0 3px rgba(46,112,105,.12);}
  .btn{border-radius:12px; min-height:40px;}
  .btn-primary{background:#2E7069 !important; color:#fff !important;}
  .btn-primary:hover{background:#275F59 !important;}
  .content .card, .stat-card, .panel{border-radius:16px;}
  tbody td{padding-block:12px;}
  thead th{background:var(--sand-100) !important;}
  .badge, .status-badge{min-height:26px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;}

  /* ══════════ ضبط أحجام المربعات حسب المدخلات ══════════ */
  .supervisor-info{padding:4px 8px; font-size:11px; gap:10px; margin-top:4px;}
  /* شبكة مضغوطة تحدد عرض كل مربع حسب محتواه */
  .fgrid.tight{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; align-items:stretch;}
  .fgrid.tight .fbox{flex:0 0 auto; padding:5px 8px;}
  .fbox.w-date{width:132px;}      /* 08/09/2026 */
  .fbox.w-days{width:78px;}       /* حتى 100 */
  .fbox.w-time{width:138px;}      /* 12:00 ص */
  .fbox.w-num4{width:96px;}       /* حتى 1000 */
  .fbox.w-num5{width:104px;}      /* حتى 2000 */
  .fbox.w-sel{width:auto; min-width:120px; max-width:190px;}
  .fbox.w-grow{flex:1 1 100%; min-width:320px;}
  .fbox.w-date input, .fbox.w-days input, .fbox.w-time input,
  .fbox.w-num4 input, .fbox.w-num5 input{min-height:20px; font-size:12.5px;}
  .fbox.w-sel select{font-size:12.5px;}
  /* الوقت: النص بعد الأيقونة مباشرة */
  .fbox.w-time .twrap > input[type="time"]{padding-inline-start:0 !important; padding-inline-end:0 !important;}
  .fbox.w-time .tview{padding-inline-start:0; padding-inline-end:26px; justify-content:flex-end; direction:ltr;}
  /* مربع الملاحظات المشروط */
  /* يجب تجاوز قاعدة pointer-events:none المطبّقة على تسميات النموذج */
  .glow-card .form-table tbody td > label.notes-toggle,
  .glow-card .form-table tbody td label.pill-opt{
    pointer-events:auto !important; position:static !important; display:inline-flex !important;
    font-size:13px !important; margin:0 !important; padding:6px 2px !important; cursor:pointer;
    background:transparent !important; white-space:nowrap; color:var(--gold-d) !important; font-weight:700;}
  .notes-toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--gold-d); padding:6px 2px; pointer-events:auto;}
  .notes-toggle input{pointer-events:auto !important; width:18px !important; height:18px; accent-color:var(--gold);}
  .notes-toggle input{width:auto; min-height:auto;}
  #notesWrap{display:none; margin-top:8px;}
  #notesWrap.on{display:block; animation:fade-up .28s var(--ease-standard) both;}
  /* لوح أضيق من الجانبين */
  .drawer-panel{inset-inline:2.5% !important;}
  @media (max-width:820px){ .drawer-panel{inset-inline:0 !important;} }

  #orderDrawer{background:linear-gradient(160deg,#FFFFFF 0%,#FBF7F2 48%,#F5EDE3 100%) !important;
    border:3px solid #39FF14 !important; border-radius:0 0 18px 18px;
    box-shadow:0 0 0 4px rgba(57,255,20,.18), 0 26px 64px rgba(11,37,64,.35) !important;}
  .page-neworder .content .gv-head{background:var(--gold-d) !important; color:#fff !important;}
  .page-neworder .content .gv-head h2, .page-neworder .content .gv-head .dh-sub{color:#fff !important;}
  .page-neworder .content .card, .page-neworder .content .fbox{background:rgba(255,255,255,.92);}
  /* الأرقام بالإنجليزية في كل النموذج */
  #orderDrawer, .page-neworder .content input, .page-neworder .content select, .page-neworder .content textarea,
  .fbox input, .fbox select{font-variant-numeric:lining-nums tabular-nums;
    -moz-font-feature-settings:"lnum"; -webkit-font-feature-settings:"lnum"; font-feature-settings:"lnum";}
  .fbox input.num, .fbox input[type="number"], .fbox input[type="time"], .fbox input[type="date"]{
    direction:ltr; text-align:right; font-weight:800;}
  .fbox .dview, .fbox .tview{font-weight:800;}
  .stat-value, .kpi-v, .num-f, tbody td .badge{font-weight:800;}
  /* المربعان الجانبيان بارتفاع متساوٍ */
  .glow-card{display:flex; flex-direction:column;}
  .glow-card > table{flex:1;}
  .grid > .card.glow-card{height:100%;}
  /* ملاحظات جنبًا إلى جنب */
  .notes-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:820px){ .notes-row{grid-template-columns:1fr;} }
  /* أزرار الحفظ بأيقونات */
  .save-bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
  .save-bar .btn{display:inline-flex; align-items:center; gap:7px;}

  /* ══════════ نموذج الطلب: مربعات بلا جداول ══════════ */
  .glow-card .form-table thead th{color:#fff !important;}
  .glow-card .form-table thead th .th-bar > span{color:#fff !important;}
  /* التسميات المقصوصة بلا خلفية بيضاء */
  .glow-card .form-table tbody td > label,
  .glow-card .form-table td .field > label{
    background:transparent !important; position:static !important; display:flex !important;
    align-items:center; gap:6px; margin:0 0 5px !important; padding:0 !important;
    font-size:11.5px !important; font-weight:700; color:var(--gold-d) !important; white-space:nowrap;}
  .glow-card .form-table tbody td{position:static !important; padding:0 !important; border:none !important;
    background:transparent !important;}
  /* كل حقل داخل مربع مستقل */
  .glow-card .form-table.compact tbody td{padding:0 !important;}
  .fbox{background:#fff; border:1px solid var(--line); border-radius:9px; padding:6px 9px;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .fbox:focus-within{border-color:var(--gold); box-shadow:0 0 0 3px rgba(27,95,166,.12);}
  .fbox > label{display:flex; align-items:center; gap:5px; margin:0 0 3px; font-size:11px;
    font-weight:700; color:var(--gold-d); white-space:nowrap;}
  .fbox input, .fbox select, .fbox textarea{width:100%; border:none !important; background:transparent !important;
    box-shadow:none !important; padding:0 !important; min-height:22px; font-size:13px; font-weight:700;}
  .fbox .dwrap{width:100%;}
  .fbox .dview{padding:0 !important; justify-content:flex-start;}
  .fgrid{display:grid; gap:7px; margin-bottom:7px;}
  /* القائمتان جنبًا إلى جنب بلا مربعات */
  .pick-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;}
  .pick-row .ms-wrap{border:none; background:transparent; overflow:visible;}
  .pick-row .ms-wrap .ms-head{border:1px solid var(--line); border-radius:10px; background:#fff;}
  .pick-row .ms-wrap.open .ms-head{border-color:var(--gold);}
  .pick-row .ms-body{position:relative;}
  @media (max-width:820px){ .pick-row{grid-template-columns:1fr;} }
  /* الأقسام الثلاثة ظاهرة دائمًا داخل القائمة، وبنودها تنزلق للأسفل عند الاختيار */
  .acc-card.sub{display:block; width:100%; border:none; border-top:1px solid var(--border-light);
    border-radius:0; box-shadow:none; background:#fff;}
  .acc-card.sub:first-child{border-top:none;}
  .acc-card.sub:hover{box-shadow:none;}
  .acc-card.sub .acc-head{width:100%; justify-content:space-between; padding:10px 13px; font-size:12.5px;}
  .acc-card.sub .acc-head:hover{background:var(--card-hover);}
  .acc-card.sub.open .acc-head{background:var(--gold-l); color:var(--gold-d);}
  .acc-card.sub .acc-body{max-width:0; overflow:hidden; opacity:0;
    transition:max-width .32s cubic-bezier(.22,1,.36,1), opacity .26s ease; background:var(--gold-l);}
  .acc-card.sub.open .acc-body{max-width:100%; opacity:1;}
  .acc-card.sub .acc-body{padding:8px 10px;}
  .acc-card.sub.open .acc-body{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; max-width:100%; opacity:1;}
  .acc-card.sub .acc-item{background:#fff; border:1px solid var(--border-light); border-radius:8px;
    padding:8px 10px; margin:0; white-space:normal; line-height:1.4;}
  .acc-card.sub .acc-item:hover{border-color:var(--gold);}
  .acc-card.sub .acc-item.on{background:#fff;}

  /* ══════════ قائمة منسدلة متعددة الاختيار ══════════ */
  .ms-wrap{border:1px solid var(--line); border-radius:10px; background:#fff; overflow:hidden;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .ms-wrap.open{border-color:var(--gold); box-shadow:0 4px 14px rgba(11,59,107,.10);}
  .ms-head{all:unset; cursor:pointer; display:flex; align-items:center; gap:9px; width:100%;
    box-sizing:border-box; padding:10px 12px; font-size:12.5px; font-weight:700; color:var(--main-text);
    transition:background .25s ease;}
  .ms-head:hover{background:var(--card-hover);}
  .ms-wrap.open .ms-head{background:var(--gold-l); color:var(--gold-d);}
  .ms-ic{display:flex; flex:none; color:var(--gold);}
  .ms-label{flex:1; min-width:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
  .ms-n{flex:none; min-width:22px; text-align:center; border-radius:999px; padding:1px 8px;
    font-size:11px; font-weight:700; background:var(--sand-200); color:var(--muted-text);}
  .ms-n.on{background:var(--gold); color:#fff;}
  .ms-chev{flex:none; color:var(--soft-text); transition:transform .28s cubic-bezier(.22,1,.36,1);}
  .ms-wrap.open .ms-chev{transform:rotate(-90deg);}
  .ms-body{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,1,.36,1);}
  .ms-wrap.open .ms-body{max-height:340px; overflow-y:auto;}
  /* عناصر المدربين داخل القائمة */
  .ms-wrap.open #trainerChipList{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:8px; padding:10px;}
  /* أقسام الطلبات داخل القائمة */
  .acc-card.sub{border:none; border-top:1px solid var(--border-light); border-radius:0; box-shadow:none;}
  .acc-card.sub:hover{border-color:var(--border-light); box-shadow:none;}
  .acc-card.sub .acc-head{padding:9px 14px; font-size:12.5px;}
  .acc-card.sub.open .acc-head{background:var(--gold-l);}
  .acc-card.sub .acc-item{padding-inline-start:26px;}

  /* ══════════ بطاقات الطلبات الإدارية القابلة للفتح ══════════ */
  .acc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:12px;}
  .acc-card{border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden;
    transition:border-color .25s ease, box-shadow .25s ease;}
  .acc-card:hover{border-color:var(--gold); box-shadow:0 4px 14px rgba(107,79,58,.10);}
  .acc-card.open{border-color:var(--gold); box-shadow:0 6px 18px rgba(107,79,58,.12);}
  .acc-head{all:unset; cursor:pointer; display:flex; align-items:center; gap:9px; width:100%;
    box-sizing:border-box; padding:12px 13px; font-size:13px; font-weight:700; color:var(--main-text);
    transition:background .25s ease;}
  .acc-head:hover{background:var(--card-hover);}
  .acc-card.open .acc-head{background:var(--gold-l); color:var(--gold-d);}
  .acc-ic{display:grid; place-items:center; width:30px; height:30px; flex:none; border-radius:9px;
    background:var(--gold-l); color:var(--gold-d);}
  .acc-card.open .acc-ic{background:#fff;}
  .acc-t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right;}
  .acc-n{flex:none; min-width:22px; text-align:center; border-radius:999px; padding:1px 8px;
    font-size:11px; font-weight:700; background:var(--sand-200); color:var(--muted-text);}
  .acc-n.on{background:var(--gold); color:#fff;}
  .acc-chev{flex:none; color:var(--soft-text); transition:transform .28s cubic-bezier(.22,1,.36,1);}
  .acc-card.open .acc-chev{transform:rotate(-90deg);}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,1,.36,1);}
  .acc-card.open .acc-body{max-height:420px; overflow-y:auto;}
  .acc-item{display:flex; align-items:center; gap:9px; padding:9px 13px; cursor:pointer;
    font-size:12.5px; color:var(--main-text); border-top:1px solid var(--border-light);
    transition:background .2s ease;}
  .acc-item:hover{background:var(--card-hover);}
  .acc-item.on{background:var(--gold-l); color:var(--gold-d); font-weight:700;}
  .acc-item input{width:auto; flex:none; min-height:auto;}
  .acc-item span{flex:1; min-width:0;}

  /* وسوم الطلبات الإدارية المضافة */
  .req-tag{display:inline-flex; align-items:center; gap:7px; background:var(--maroon-50);
    border:1px solid var(--maroon-100); color:var(--maroon-800); border-radius:20px;
    padding:5px 12px; font-size:13px; font-weight:700;}
  .req-tag a{text-decoration:none; font-size:13px; line-height:1; opacity:.75;}
  .req-tag a:hover{opacity:1;}
  /* أيقونات الجداول أصغر ومتناسقة داخل الصف */
  .orders-page table .icon-btn{width:24px; height:24px; font-size:12px; padding:0; line-height:1;
    border-radius:6px; vertical-align:middle;}
  .orders-page table td{white-space:nowrap;}

  .glow-card .form-table .dwrap{position:relative; display:block; width:100%; min-width:150px;}
  .glow-card .form-table input[type="date"]{width:100%; min-width:150px; box-sizing:border-box;
    padding-inline-start:11px; padding-inline-end:34px;}
  /* نص التاريخ متوسط داخل المربع ولا يخرج منه */
  .glow-card .form-table .dview{
    inset:0; display:flex; align-items:center; justify-content:center;
    padding-inline-start:11px; padding-inline-end:34px; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* إخفاء سطر توضيح التاريخ في هذه الصفحة (النقطة والشريط يغنيان عنه) */
  .glow-card .date-hint{display:none !important;}
  /* مربعات مرنة: تتقلّص إن لم يكن فيها مدخلات */
  .glow-card .form-table.compact tbody td{width:1%; white-space:nowrap;}
  .glow-card .form-table.compact tbody td:has(input[type="text"]),
  .glow-card .form-table.compact tbody td[colspan]{width:auto;}
  .glow-card .form-table .auto-w{width:auto; min-width:0;}
  .glow-card .form-table .auto-w.num{width:86px;}
  .glow-card .form-table select{width:auto; min-width:130px; max-width:100%;}
  /* تقليص إضافي للمسافات الرأسية */
  .glow-card .form-table.compact tbody tr + tr td{padding-top:7px;}
  .glow-card .helper{display:none;}
  .glow-card .form-table:not(.compact) tbody td textarea{min-height:56px;}

  .glow-card .form-table.compact tbody td{padding:8px 5px 2px; vertical-align:top;}
  .glow-card .form-table tbody td > label{
    position:absolute; top:-8px; right:12px; z-index:2;
    background:#fff; padding:0 6px; margin:0;
    font-size:11px !important; font-weight:700; color:var(--maroon-800);
    line-height:1.1; white-space:nowrap; pointer-events:none;}
  /* كل خلية تصبح مرجعًا للتموضع */
  .glow-card .form-table tbody td{position:relative;}
  /* الحقل نفسه بإطار واضح ليظهر القص */
  .glow-card .form-table input,
  .glow-card .form-table select,
  .glow-card .form-table textarea{
    border:1px solid var(--line-strong); border-radius:10px; min-height:40px; padding:7px 11px;}
  .glow-card .form-table .dwrap{display:block; width:100%;}
  .glow-card .form-table .dview{padding-inline-start:11px;}
  /* تقليل المسافات بين الأسطر */
  .glow-card .form-table.compact tbody tr + tr td{padding-top:11px;}
  .glow-card .grid{gap:8px; margin-bottom:8px;}
  .glow-card .field{margin-bottom:0;}
  /* بطاقتا الملاحظات والطلبات الإدارية بنفس النمط */
  .glow-card .form-table:not(.compact) tbody td{position:relative; padding:14px 10px 8px;}
  .glow-card .form-table:not(.compact) tbody td textarea{min-height:70px; resize:vertical;}
  /* الحقول المرنة داخل الصف الأول */
  .glow-card .form-table td .field{position:relative; padding-top:2px;}
  .glow-card .form-table td .field > label{
    position:absolute; top:-8px; right:12px; background:#fff; padding:0 6px;
    font-size:12px !important; font-weight:700; color:var(--maroon-800); line-height:1.1; white-space:nowrap;}

  .glow-card .form-table thead th,
  .glow-card .form-table thead th .th-bar > span{font-size:15px;}
  .glow-card .form-table tbody td label{font-size:12px;}
  .glow-card input, .glow-card select, .glow-card textarea{font-size:13px; padding:9px 11px;}
  .glow-card .checkbox-chip, .glow-card .presenter-chip{font-size:12.5px;}
  .glow-card .form-table tbody td{font-size:13px;}
  /* تبقى الأدوات الصغيرة بحجمها حتى لا يختل الشريط العلوي للقسم */
  .glow-card .th-actions .plus-btn.mini,
  .glow-card .th-actions .th-search{font-size:12px;}
  .glow-card .helper{font-size:12.5px;}
  .glow-card .date-hint{font-size:12px;}

  /* ══ مدخلات نموذج الفعالية: أسود غامق ══ */
  .glow-card input, .glow-card select, .glow-card textarea{color:#1C323B !important; font-weight:700;}
  .glow-card select option{color:#3E2C22;}
  /* التاريخ بخط Lusail (يعود لبديل مناسب إن لم يكن مثبّتًا) */
  input[type="date"], input[type="month"], .date-cell, .num-f{
    font-family:'Lusail','Tajawal',Arial, sans-serif;}
  .glow-card input[type="date"], .glow-card input[type="month"]{color:#000 !important; font-weight:700;}

  /* ══ الإداريات اليومية والأنشطة القرآنية: مدخلات بحجم 18 ══ */
  .big-inputs input, .big-inputs select, .big-inputs textarea{font-size:13px; color:var(--ink); min-height:40px;}
  .big-inputs label{font-size:12px;}
  .big-inputs table{font-size:13px;}
  .big-inputs table th{font-size:12px;}
  .big-inputs .helper{font-size:13px;}
  .big-inputs .icon-btn.rect, .big-inputs .btn{font-size:12px;}

  /* ══ صفحات النظام: أزرق فاتح، وتتحول للعنابي عند النقر، والنص أسود ══ */
  .card{background:#EAF4FC;}                 /* لوح الصفحة أزرق فاتح */
  .card h2{background:#DCEBF8; color:#000;}  /* عنوان اللوح */
  .card.is-active{background:var(--maroon-50); box-shadow:0 0 0 2px var(--maroon-800) inset;}
  .card.is-active h2{background:var(--maroon-800); color:#fff;}
  .content, .card, .card td, .card th, .card label, .card p, .card div{color:#000;}
  .card input, .card select, .card textarea{background:#fff; color:#000;}
  /* الجداول */
  thead th{background:#DCEBF8 !important; color:#000 !important;}
  tbody td{color:#000;}
  tbody tr:hover{background:#DCEBF8;}
  /* الأوراق الفرعية أزرق فاتح، والنشطة عنابي */
  .sv-item{background:#EAF4FC; border-color:#BBD9F0; color:#000;}
  .sv-item:hover{background:#DCEBF8;}
  .sv-item.active{background:var(--maroon-800); color:#fff; border-color:var(--maroon-800);}
  /* مربعات الإحصائيات */
  .stat-box{background:#EAF4FC;}
  .stat-box .num{color:#000;}
  .stat-box .lbl{color:#333;}
  .stat-box .ic{background:#DCEBF8; border-color:#BBD9F0;}

  /* ══ بطاقة اختيار التقرير: عنوان كبير وأسفله مربعا التاريخ ══ */
  /* عمود الفترة: نصفان متساويان (البداية | النهاية) */
  .prd{display:flex; align-items:stretch; width:100%;}
  .prd-a, .prd-b{flex:1 1 50%; text-align:center; white-space:nowrap; padding:0 4px;}
  .prd-a{border-inline-end:1px solid var(--line);}
  .rep-doc .prd-a{border-inline-end:1px solid ${PRINT_LINE_COLOR};}
  th .prd-a, th .prd-b{font-weight:700;}

  /* ══ أسلوب البطاقات الناعم (مستوحى من التصميم المرجعي) ══ */
  /* ══════════ القائمة الجانبية — كحلي داكن، عنصر نشط بارز نصف دائري ══════════ */
  #app.sidenav-layout{display:flex; min-height:100vh; width:100%; max-width:100%; background:#F8FAFC;}
  #sideNav{width:80px; flex:0 0 80px; background:var(--brand-950); color:#fff; font-family:'Tajawal',sans-serif; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; overflow:visible; transition:width .22s ease, flex-basis .22s ease; z-index:40;}
  body.nav-open #sideNav{width:276px; flex-basis:276px;}
  #sideNav .nav-text, #sideNav .sn-name, #sideNav .sn-sub, #sideNav .sn-uname, #sideNav .sn-role{
    opacity:0; max-width:0; overflow:hidden; white-space:nowrap; transition:opacity .18s, max-width .22s;}
  body.nav-open #sideNav .nav-text, body.nav-open #sideNav .sn-name, body.nav-open #sideNav .sn-sub,
  body.nav-open #sideNav .sn-uname, body.nav-open #sideNav .sn-role{opacity:1; max-width:170px;}
  #mainCol{flex:1; min-width:0; display:flex; flex-direction:column; background:#F8FAFC;}

  .sn-brand{text-align:center; padding:16px 8px 12px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sn-brand #logoSlot img{height:38px; width:auto; margin:0 auto 6px; display:block;}
  .sn-brand .logo-placeholder{font-size:26px; color:var(--brand-300);}
  .sn-name{font-size:13px; font-weight:700; color:#fff; margin:0 auto; font-family:var(--font-head);}
  .sn-sub{font-size:10.5px; color:rgba(255,255,255,.5); margin:2px auto 0;}
  .sn-user{text-align:center; padding:12px 8px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sn-uname{font-size:12px; font-weight:700; color:#fff; margin:0 auto;}
  .sn-role{font-size:10.5px; color:var(--brand-300); margin:2px auto 0;}

  .sn-list{flex:1; padding:12px 0; display:flex; flex-direction:column; gap:6px; overflow-y:auto; overflow-x:visible;}
  .sn-item{all:unset; cursor:pointer; position:relative; display:flex; align-items:center; gap:12px; font-size:12.5px; font-family:var(--font-body);
    margin:0 0 0 10px; padding:12px 0 12px 0; padding-inline-start:22px;
    border-radius:30px 0 0 30px; color:rgba(255,255,255,.72);
    transition:background .16s, color .16s, transform .16s;}
  .sn-item:hover{background:rgba(255,255,255,.07); color:#fff;}
  /* العنصر النشط: بارز خارج القائمة بنصف دائرة، عنابي بإطار ذهبي */
  .sn-item.active{background:#0F6248; color:#fff; font-weight:700;
    border:2px solid var(--brand-300); border-inline-end:none; margin-inline-end:-14px; padding-inline-end:14px;
    box-shadow:0 4px 14px rgba(11,111,80,.40);}
  .sn-ic{font-size:19px; line-height:1; width:26px; text-align:center; flex:none;}
  .nv-badge{margin-inline-start:auto; margin-inline-end:14px; background:var(--gold-600); color:#fff;
    border-radius:20px; padding:0 7px; font-size:11px; font-weight:700;}
  /* تلميح اسم الصفحة في الوضع المطوي */
  .sn-item::after, .sn-logout::after{content:attr(data-tip); position:absolute; right:calc(100% + 10px); top:50%;
    transform:translateY(-50%); background:var(--brand-900); color:#fff; padding:5px 11px; border-radius:8px;
    font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .14s; z-index:80;}
  .sn-item:hover::after, .sn-logout:hover::after{opacity:1;}
  body.nav-open .sn-item::after, body.nav-open .sn-logout::after{display:none;}
  .sn-logout{all:unset; cursor:pointer; position:relative; display:flex; align-items:center; gap:14px; font-family:'Tajawal',sans-serif;
    margin:8px 10px 14px 10px; padding:12px 0; padding-inline-start:22px; border-radius:30px;
    font-size:14px; color:rgba(255,255,255,.65); border-top:1px solid rgba(255,255,255,.08);}
  .sn-logout:hover{background:rgba(255,255,255,.07); color:#fff;}
  #navToggle2{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; margin:8px auto 0; border-radius:9px; background:rgba(255,255,255,.10); color:#fff; font-size:15px;}
  #navToggle2:hover{background:rgba(255,255,255,.2);}

  /* الترويسة والمحتوى */
  #topHeader{position:sticky; top:0; z-index:30; background:rgba(251,250,247,.86); color:var(--ink); backdrop-filter:blur(14px);
    display:flex; align-items:center; gap:12px; min-height:91px; padding:14px 22px;
    border-bottom:1px solid #E2E8F0; box-shadow:0 1px 4px rgba(15,23,42,.04);}

      state.trainerRequests.forEach(r=>{ if(!r.trainerId && r.trainerIds && r.trainerIds[0]) r.trainerId=r.trainerIds[0]; });
      state.users.forEach(u=>{ if(u.active===undefined) u.active=true; });
      state.tasks.forEach(t=>{ if(!t.status){ t.status = t.done ? 'مكتملة' : 'لم تبدأ'; } if(!t.priority){ t.priority='متوسطة'; } });
      return;
    }
  }catch(e){
    console.error('load error', e);
    syncState.ok = false;
    /* ⚠ لا نكتب بيانات افتراضية فوق قاعدة البيانات عند فشل القراءة —
       كان هذا يمحو البيانات الحقيقية عند أي انقطاع شبكة أو خطأ صلاحيات. */
    state = defaultState();
    __readFailed = true;
    alert('تعذّر تحميل البيانات من قاعدة البيانات.\n\n'
      + 'السبب: ' + (e && e.message ? e.message : e) + '\n\n'
      + '⚠ لن يُحفظ أي تعديل حتى تنجح القراءة، حمايةً لبياناتك.\n'
      + 'أعد تحميل الصفحة بعد التأكد من الاتصال.');
    return;
  }
  /* المستند موجود لكن محتواه غير صالح → لا نكتب فوقه */
  if(__docExisted){
    state = defaultState();
    __readFailed = true;
    alert('البيانات المخزّنة غير قابلة للقراءة.\n\n'
      + '⚠ لن يُحفظ أي تعديل حمايةً لما هو مخزّن.\n'
      + 'تواصل مع المطوّر قبل المتابعة.');
    return;
  }
  /* لا يوجد مستند إطلاقًا → أول تشغيل، ننشئ البيانات الابتدائية */
  state = defaultState();
  await saveState();
}
/* أعلام حماية: تمنع الكتابة عند فشل القراءة */
let __readFailed = false, __docExisted = false;
const syncState = { ok:false, lastAt:null };
let saving=false, pendingSave=false;
/* ══════════════════════════════════════════════════════════════════
   الحفظ مع تجميع الطلبات (Debounce) — تحسين أداء
   ──────────────────────────────────────────────────────────────────
   كان كل تعديل صغير يُنفّذ JSON.stringify لكامل البيانات + كتابة شبكية
   كاملة، فيبطؤ النظام مع كثرة السجلات. الآن تُجمَّع التعديلات المتتابعة
   في كتابة واحدة بعد 600ms، مع ضمان الحفظ عند إغلاق الصفحة.
   ══════════════════════════════════════════════════════════════════ */
let __saveTimer = null;
function saveState(){
  return new Promise(resolve=>{
    if(__saveTimer) clearTimeout(__saveTimer);
    __saveTimer = setTimeout(()=>{ __saveTimer=null; flushSave().then(resolve); }, 600);
  });
}
async function flushSave(){
  /* ⚠ حماية: لا نكتب إطلاقًا إذا لم تنجح قراءة البيانات */
  if(__readFailed){
    toast('⚠️ الحفظ متوقف: لم تُقرأ البيانات بنجاح. أعد تحميل الصفحة.');
    return;
  }
  if(saving){ pendingSave=true; return; }
  saving=true;
  try{
    const payload = JSON.stringify(state);
    /* نسخة احتياطية محلية قبل كل كتابة — للاسترجاع عند أي خطأ */
    try{
      localStorage.setItem('backup_prev', localStorage.getItem('backup_last') || '');
      localStorage.setItem('backup_last', payload);
      localStorage.setItem('backup_at', new Date().toISOString());
    }catch(e){}
    await STATE_DOC().set({ json: payload, updatedAt: Date.now() });
    syncState.ok = true; syncState.lastAt = Date.now(); renderUserBox();
  }catch(e){
    console.error('save error', e);
    syncState.ok = false; renderUserBox();
    // إظهار الخطأ بوضوح بدل الفشل الصامت الذي كان يسبب فقدان البيانات
    toast('⚠️ لم يتم حفظ البيانات! ' + (e && e.message ? e.message : ''));
  }
  saving=false;
  if(pendingSave){ pendingSave=false; flushSave(); }
}
/* ضمان عدم ضياع أي تعديل معلّق عند إغلاق الصفحة أو تركها */
window.addEventListener('beforeunload', ()=>{ if(__saveTimer){ clearTimeout(__saveTimer); __saveTimer=null; flushSave(); } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && __saveTimer){ clearTimeout(__saveTimer); __saveTimer=null; flushSave(); } });

function monthOnlyAr(m){
  if(!m) return '';
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const mm = String(m).includes('-') ? String(m).split('-')[1] : m;
  return names[parseInt(mm,10)-1] || m;
}
function monthNameAr(m){
  if(!m) return '';
  const names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const [y, mm] = m.split('-');
  const idx = parseInt(mm,10)-1;
  return (names[idx]||mm) + ' ' + y;
}

function openModal(title, fieldsConfig, onSubmit){
  const overlay=document.getElementById('modalOverlay'); const box=document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3><div id="modalFields" class="grid"></div>
    <div class="modal-actions"><button class="btn btn-outline" id="modalCancel">إلغاء</button><button class="btn btn-primary" id="modalSave">حفظ</button></div>`;
  const fc = box.querySelector('#modalFields');
  fieldsConfig.forEach(f=>{
    const wrap=document.createElement('div'); wrap.className='field';
    wrap.innerHTML = `<label>${f.label}</label>` + (f.type==='select'
      ? `<select id="mf_${f.name}">${f.options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select>`
      : `<input id="mf_${f.name}" type="${f.type||'text'}" placeholder="${f.placeholder||''}">`);
    fc.appendChild(wrap);
  });
  overlay.classList.add('open');
  box.querySelector('#modalCancel').onclick=()=>overlay.classList.remove('open');
  box.querySelector('#modalSave').onclick=async ()=>{
    const values={};
    fieldsConfig.forEach(f=>{ values[f.name]=document.getElementById('mf_'+f.name).value.trim(); });
    if(fieldsConfig.some(f=>f.required && !values[f.name])){ toast('يرجى تعبئة الحقول المطلوبة'); return; }
    const __result = await onSubmit(values);
    if(__result !== false){ overlay.classList.remove('open'); }
  };

function starRatingHtml(name, val){

  for(let i=1;i<=10;i++){ stars += `<span class="star" data-name="${name}" data-val="${i}" style="cursor:pointer;font-size:19px;color:${i<=val?'var(--gold)':'#ddd'}">★</span>`; }
  return `<div id="stars_${name}">${stars}</div><input type="hidden" id="${name}_val" value="${val}"><div class="helper">التقييم الحالي: <span id="${name}_lbl">${val}</span> / 10</div>`;

function wireStars(container){
  container.querySelectorAll('.star').forEach(s=>{
    s.onclick=()=>{
      const name=s.dataset.name, val=Number(s.dataset.val);
      document.getElementById(name+'_val').value = val;
      const lbl=document.getElementById(name+'_lbl'); if(lbl) lbl.textContent=val;
      container.querySelectorAll(`.star[data-name="${name}"]`).forEach(st=>{ st.style.color = Number(st.dataset.val)<=val ? 'var(--gold)':'#ddd'; });
    };
  });
}

/* ============ Scheduling conflict helpers ============ */
function parseDT(dateStr, timeStr){ if(!dateStr) return null; return new Date(dateStr+'T'+(timeStr||'00:00')+':00'); }
function dateRangesOverlap(aFrom, aTo, bFrom, bTo){
  return aFrom <= (bTo||aFrom) && (aTo||aFrom) >= bFrom;
}
function trainerConflictSingle(trainerId, date, timeFrom, timeTo, excludeOrderId, dateTo){
  if(!trainerId || !date) return null;
  const dTo = dateTo || date;
  const bufferMs = 90*60*1000;
  // نقارن وقت اليوم فقط (بغض النظر عن التاريخ الفعلي) باستخدام يوم مرجعي ثابت،
  // لأن الفعالية متعددة الأيام تتكرر بنفس الفترة الزمنية كل يوم ضمن مدتها
  const refDay = '2000-01-01';
  const newStart = parseDT(refDay, timeFrom||'00:00'), newEnd = parseDT(refDay, timeTo||timeFrom||'23:59');
  return state.orders.find(o=>{
    if(o.id===excludeOrderId) return false;
    if(!(o.trainerIds||[]).includes(trainerId)) return false;
    const oTo = o.dateTo || o.date;
    if(!dateRangesOverlap(date, dTo, o.date, oTo)) return false;
    const exStart = parseDT(refDay, o.timeFrom||'00:00'), exEnd = parseDT(refDay, o.timeTo||o.timeFrom||'23:59');
    const winStart = new Date(exStart.getTime()-bufferMs), winEnd = new Date(exEnd.getTime()+bufferMs);
    return newStart < winEnd && newEnd > winStart;
  }) || null;
}
function anyTrainerConflict(trainerIds, date, timeFrom, timeTo, excludeOrderId, dateTo){
  for(const tId of (trainerIds||[])){
    const c = trainerConflictSingle(tId, date, timeFrom, timeTo, excludeOrderId, dateTo);
    if(c) return {trainerId:tId, order:c};
  }
  return null;
}
/* رقم أمر التكليف: تسلسل عام مستمر لا يُصفَّر مع بداية كل سنة */
/* تصريف كلمة يوم حسب العدد: 1 يوم | 2 يومان | 3-10 أيام | 11+ يومًا */
/* تصريف كلمة فعالية: 1 فعالية | 2 فعاليتان | 3-10 فعاليات | 11+ فعالية */
function eventWord(n){
  n = Number(n)||0;
  if(n === 1) return 'فعالية';
  if(n === 2) return 'فعاليتان';
  const r = n % 100;
  if(r >= 3 && r <= 10) return 'فعاليات';
  return 'فعالية';
}
function dayWord(n){
  n = Number(n)||0;
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومان';
  const r = n % 100;
  if(r >= 3 && r <= 10) return 'أيام';
  return 'يومًا';
}
function nextOrderSerial(){
  return (state.orders||[]).reduce((m,o)=>Math.max(m, Number(o.serial)||0), 0) + 1;
}
function schoolSameDay(schoolId, date, excludeOrderId){
  if(!schoolId||!date) return null;
  return state.orders.find(o=> o.id!==excludeOrderId && o.schoolId===schoolId && o.date===date) || null;
}
/* فعاليات أخرى في نفس المدرسة خلال نفس الأسبوع (يُستثنى ما كان لنفس المدرب) */
function schoolSameWeek(schoolId, date, excludeOrderId, trainerIds){
  if(!schoolId||!date) return [];
  const {start, end} = getWeekBounds(date);
  const mine = new Set(trainerIds||[]);
  return state.orders.filter(o=>{
    if(o.id===excludeOrderId || o.schoolId!==schoolId) return false;
    const s = o.date||'', e = o.dateTo||o.date||'';
    if(!(s <= end && e >= start)) return false;
    const others = (o.trainerIds||[]);
    // ننبّه فقط إن كان هناك مقدّم مختلف عن المقدّمين المختارين
    return others.some(id=>!mine.has(id)) || others.length===0;
  });
}

function doLogin(){
  const eBox = document.getElementById('lg_err');
  const fail = msg => { if(eBox){ eBox.textContent=msg; eBox.style.display='block'; } };
  const uEl = document.getElementById('lg_user'), pEl = document.getElementById('lg_pass');
  if(!uEl || !pEl) return;
  /* تنظيف المدخلات: مسافات ومحارف اتجاهية قد تلتصق عند النسخ أو التعبئة التلقائية */
  const clean = v => String(v||'').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
  const u = clean(uEl.value);
  const p = clean(pEl.value);
  if(!u || !p){ fail('يرجى إدخال اسم المستخدم وكلمة المرور'); return; }
  /* حماية: قائمة المستخدمين قد لا تكون جاهزة بعد */
  const users = (state && Array.isArray(state.users)) ? state.users : [];
  if(!users.length){ fail('لم تُحمَّل بيانات المستخدمين بعد — انتظر لحظة ثم أعد المحاولة'); return; }
  /* اسم المستخدم غير حسّاس لحالة الأحرف، وكلمة المرور مطابقة تامة */
  const match = users.find(x =>
    clean(x.username).toLowerCase() === u.toLowerCase() && clean(x.password) === p);
  if(!match){
    const userExists = users.some(x => clean(x.username).toLowerCase() === u.toLowerCase());
    fail(userExists ? 'كلمة المرور غير صحيحة' : 'اسم المستخدم غير موجود');
    return;
  }
  try{
    const rem = document.getElementById('lg_remember');
    if(rem && rem.checked) localStorage.setItem('rememberUser', u); else localStorage.removeItem('rememberUser');
  }catch(e){}
  if(match.active===false){ document.getElementById('lg_err').textContent='هذا الحساب معطّل، تواصل مع مدير النظام'; document.getElementById('lg_err').style.display='block'; return; }
  currentUser = match;
  currentRole = match.role;
  loggedTrainerId = match.role==='trainer' ? match.trainerId : null;
  currentPage='home'; trainerPortalTab='upcoming'; tpAutoOpened=false;
  renderRoot();
}

function renderBell(){
  const today = todayStr();
  let upcomingList, notifList, notifKind;
  if(currentRole==='trainer' && loggedTrainerId){
    const myOrders = state.orders.filter(o=>(o.trainerIds||[]).includes(loggedTrainerId));
    upcomingList = myOrders.filter(o=>{ const d=daysDiffSafe(today,o.date); return d!==null && d>=0 && d<=2; });
    notifList = state.notifications.filter(n=>n.trainerId===loggedTrainerId).sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);
    notifKind='trainer';
  } else {
    upcomingList = state.orders.filter(o=>{ const d=daysDiffSafe(today,o.date); return d!==null && d>=0 && d<=2; });
    notifList = state.adminNotifications.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);
    notifKind='admin';
  }
  const unreadCount = notifList.filter(n=>!n.read).length;
  const wrap = document.createElement('div');
  wrap.className='bell-wrap';
  wrap.innerHTML = `<button class="bell-btn" id="bellBtn">🔔${unreadCount?'<span class="dot"></span>':''}</button>
    <div class="bell-pnl" id="bellPnl">
      ${upcomingList.length?`<div style="font-weight:700;color:var(--maroon-800);padding:8px 10px;">فعاليات قريبة (خلال يومين)</div>${upcomingList.map(o=>`<div class="bell-item">📅 ${escapeHtml(o.title)} — ${o.date} ${o.timeFrom||''}</div>`).join('')}`:''}
      <div style="font-weight:700;color:var(--maroon-800);padding:8px 10px;">الإشعارات</div>
      ${notifList.length?notifList.map(n=>`<div class="bell-item" style="${n.read?'':'background:var(--maroon-50);'}">${escapeHtml(n.message)}</div>`).join(''):'<div class="bell-item" style="color:#999;">لا توجد إشعارات</div>'}
    </div>`;
  document.getElementById('topbarActions').appendChild(wrap);
  document.getElementById('bellBtn').onclick=async (e)=>{
    e.stopPropagation();
    document.getElementById('bellPnl').classList.toggle('open');
    if(notifKind==='admin'){ state.adminNotifications.forEach(n=>n.read=true); }
    else { state.notifications.filter(n=>n.trainerId===loggedTrainerId).forEach(n=>n.read=true); }
    await saveState();
  };
  document.addEventListener('click', function closeBell(ev){ const pnl=document.getElementById('bellPnl'); if(pnl && !wrap.contains(ev.target)){ pnl.classList.remove('open'); } }, {once:true});
}

/* ══════════════════════════════════════════════════════════════════
   توضيح التاريخ تحت كل حقل تاريخ
   ──────────────────────────────────────────────────────────────────
   حقل <input type="date"> يعرض ترتيب اليوم/الشهر حسب لغة المتصفح،
   وقد يظهر mm/dd/yyyy في بعض الأجهزة مما يوهم أن الشهر هو اليوم.
   القيمة المخزَّنة دائمًا صحيحة (YYYY-MM-DD)، لذا نعرض تحت كل حقل
   نصًا صريحًا بالعربية لا يحتمل اللبس، مثل: 6 أغسطس 2026 (06/08/2026)
   ══════════════════════════════════════════════════════════════════ */
function dateInWords(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const day=parseInt(m[3],10), mon=names[parseInt(m[2],10)-1]||m[2], yr=m[1];
  return `${day} ${mon} ${yr} (${m[3]}/${m[2]}/${m[1]})`;
}
/* عند النقر على أي لوح يتحول للعنابي، ويعود ما سواه للأزرق الفاتح */
function attachCardActivation(){
  const host = document.getElementById('content');
  if(!host || host.dataset.cardActBound === '1') return;
  host.addEventListener('click', e=>{
    const card = e.target.closest('.card');
    if(!card || !host.contains(card)) return;
    host.querySelectorAll('.card.is-active').forEach(c=>{ if(c!==card) c.classList.remove('is-active'); });
    card.classList.add('is-active');
  });
  host.dataset.cardActBound = '1';
}
/* ══════════════════════════════════════════════════════════════════
   عرض حقول التاريخ بصيغة يوم/شهر/سنة دائمًا
   ──────────────────────────────────────────────────────────────────
   المتصفح يعرض <input type="date"> بترتيب لغة الجهاز (قد يكون mm/dd/yyyy)
   ولا يمكن فرض الترتيب عبر CSS. الحل: نخفي نص المتصفح ونضع فوقه نصًا
   من صنعنا بصيغة DD/MM/YYYY، مع بقاء تقويم المتصفح يعمل كالمعتاد.
   ══════════════════════════════════════════════════════════════════ */
/* يعرض المحتوى كما هو إن كان HTML مُعدًّا مسبقًا، وإلا يُهرّبه */
function cellHtml(v){
  const s = String(v===null||v===undefined?'':v);
  return s.trim().startsWith('<') ? s : escapeHtml(s);
}
/* تحديث النص المعروض فوق حقل التاريخ بعد تعيين القيمة برمجيًا
   (تعيين .value لا يُطلق input/change فيبقى الحقل يبدو فارغًا) */
function refreshDateView(el){
  if(!el) return;
  const wrap = el.parentElement;
  if(!wrap || !wrap.classList.contains('dwrap')) return;
  const view = wrap.querySelector('.dview');
  if(!view) return;
  view.textContent = el.value ? fmtDate(el.value).replace(/[\u2066\u2069]/g,'') : 'يوم/شهر/سنة';
  view.classList.toggle('empty', !el.value);
}
function setDateValue(el, v){
  if(!el) return;
  el.value = v || '';
  refreshDateView(el);
}
/* عرض الوقت بأرقام إنجليزية دائمًا (المتصفح يعرضه بأرقام عربية حسب لغة الجهاز) */
function fmtTime12(v){
  if(!v) return '--:-- --';
  const [H,M] = v.split(':').map(Number);
  const ap = H < 12 ? 'ص' : 'م';
  let h12 = H % 12; if(h12 === 0) h12 = 12;
  return `${String(h12).padStart(2,'0')}:${String(M).padStart(2,'0')} ${ap}`;
}
function refreshTimeView(el){
  if(!el) return;
  const wrap = el.parentElement;
  if(!wrap || !wrap.classList.contains('twrap')) return;
  const view = wrap.querySelector('.tview');
  if(!view) return;
  view.textContent = fmtTime12(el.value);
  view.classList.toggle('empty', !el.value);
}
function attachTimeDisplays(){
  document.querySelectorAll('.page-neworder .content input[type="time"], .glow-card input[type="time"]').forEach(inp=>{
    let wrap = inp.parentElement;
    if(!wrap || !wrap.classList.contains('twrap')){
      wrap = document.createElement('span'); wrap.className='twrap';
      inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
      const v = document.createElement('span'); v.className='tview'; wrap.appendChild(v);
    }
    if(!inp.dataset.tviewBound){
      ['input','change'].forEach(ev=>inp.addEventListener(ev, ()=>refreshTimeView(inp)));
      inp.dataset.tviewBound='1';
    }
    refreshTimeView(inp);
  });
}
function attachDateDisplays(){
  document.querySelectorAll('input[type="date"]').forEach(inp=>{
    let wrap = inp.parentElement;
    if(!wrap || !wrap.classList.contains('dwrap')){
      wrap = document.createElement('span');
      wrap.className = 'dwrap';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      const view = document.createElement('span');
      view.className = 'dview';
      wrap.appendChild(view);
    }
    const view = wrap.querySelector('.dview');
    const upd = ()=>{
      const v = inp.value;
      view.textContent = v ? fmtDate(v).replace(/[\u2066\u2069]/g,'') : 'يوم/شهر/سنة';
      view.classList.toggle('empty', !v);
    };
    if(!inp.dataset.dviewBound){
      inp.addEventListener('input', upd);
      inp.addEventListener('change', upd);
      inp.dataset.dviewBound = '1';
    }
    upd();
  });
}
function attachDateHints(){
  document.querySelectorAll('input[type="date"]').forEach(inp=>{
    if(inp.closest('td') && inp.classList.contains('qs-field')) return; // جدول التعديل السريع: مساحته ضيقة
    let hint = inp.nextElementSibling;
    if(!hint || !hint.classList || !hint.classList.contains('date-hint')){
      hint = document.createElement('div');
      hint.className = 'date-hint';
      inp.insertAdjacentElement('afterend', hint);
    }
    const upd = ()=>{ hint.textContent = inp.value ? dateInWords(inp.value) : ''; };
    if(!inp.dataset.hintBound){ inp.addEventListener('input', upd); inp.addEventListener('change', upd); inp.dataset.hintBound='1'; }
    upd();
  });
}

function addDaysISO(iso, n){
  /* نبني التاريخ من المكوّنات المحلية — toISOString يحوّل إلى UTC
     فيُرجِع اليوم السابق في التوقيتات المتقدمة عن غرينتش (مثل +3) */
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
/* يفحص تاريخ الفعالية مقابل التقويم ويعيد قائمة تنبيهات */
function checkAcademicDate(date, dateTo){
  if(!date) return [];
  const s = date, e = dateTo || date;
  const out = [];
  // أول يوم دوام للطلبة = بداية قبول طلبات الفعاليات
  const firstStudentDay = ACADEMIC_CALENDAR.filter(x=>x.kind==='studentStart').map(x=>x.from).sort()[0];
  if(firstStudentDay && s < firstStudentDay){
    out.push({level:'warn', msg:`التاريخ قبل بدء الدوام للطلبة (${fmtDate(firstStudentDay)}) — قبول طلبات الفعاليات يبدأ من ذلك التاريخ.`});
  }
  ACADEMIC_CALENDAR.forEach(ev=>{
    const overlaps = s <= ev.to && e >= ev.from;
    if(ev.kind==='exam'){
      // فترة الاختبارات + الأسبوع الذي يسبقها
      const preFrom = addDaysISO(ev.from, -7);
      if(s <= ev.to && e >= preFrom){
        const inside = overlaps;
        out.push({level:'block',
          msg:`${inside?'التاريخ داخل فترة اختبارات':'التاريخ ضمن الأسبوع الذي يسبق الاختبارات'}: ${ev.t} (${fmtDate(ev.from)} — ${fmtDate(ev.to)}) — لا يمكن تقديم برامج أو فعاليات.`});
      }
    } else if(ev.kind==='holiday' && overlaps){
      out.push({level:'block', msg:`التاريخ ضمن إجازة: ${ev.t} (${fmtDate(ev.from)} — ${fmtDate(ev.to)}) — لا يجوز تقديم فعاليات.`});
    } else if(ev.kind==='staff' && overlaps){
      out.push({level:'block', msg:`التاريخ في فترة بدء دوام الموظفين: ${ev.t} (${fmtDate(ev.from)}) — لا يجوز تقديم فعاليات.`});
    }
  });
  // تذكير: ليس يومًا دراسيًا معروفًا
  if(!out.length){
    const known = ACADEMIC_CALENDAR.some(ev=>s <= ev.to && e >= ev.from);
    const isWeekend = [5,6].includes(new Date(s+'T00:00:00').getDay()); // الجمعة والسبت
    if(isWeekend) out.push({level:'warn', msg:'التاريخ يقع في عطلة نهاية الأسبوع (الجمعة/السبت) — تذكير: قد لا يكون يومًا تعليميًا.'});
    else if(!known) out.push({level:'info', msg:'هذا التاريخ غير مدرج في التقويم المدرسي كيوم فعالية معروف — تذكير فقط في حال كان البرنامج غير خاص بالمدارس.'});
  }
  return out;
}

/* صف تفصيلي بشريط نسبة — بأسلوب جداول لوحة التحكم */
function breakdownRows(items, total){
  if(!items.length) return `<tr><td colspan="3" style="text-align:center;color:#999;padding:10px;">لا توجد بيانات</td></tr>`;
  return items.map(it=>{
    const pct = total ? Math.round((it.count/total)*1000)/10 : 0;
    return `<tr>
      <td style="text-align:right;">${escapeHtml(it.name)}</td>
      <td style="width:44%;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;height:8px;background:#EFEDE6;border-radius:20px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${it.color||'#8A1538'};"></div>
          </div>
        </div>
      </td>
      <td style="width:64px;">${it.count}</td>
      <td style="width:64px;direction:ltr;">${pct}%</td>
    </tr>`;
  }).join('');
}
/* ══ رسم دائري (Donut) بلا مكتبات — SVG خالص ══ */
function donutChart(items, centerLabel, centerValue){
  const total = items.reduce((s,x)=>s+x.count,0);
  if(!total) return '<div class="empty-state">لا توجد بيانات</div>';
  const R = 62, SW = 22, C = 2*Math.PI*R;
  let acc = 0;
  const arcs = items.map(it=>{
    const frac = it.count/total;
    const dash = `${(frac*C).toFixed(2)} ${(C-frac*C).toFixed(2)}`;
    const off = (-acc*C).toFixed(2);
    acc += frac;
    return `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${it.color}" stroke-width="${SW}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 80 80)"></circle>`;
  }).join('');

function barChart(items){

}
/* ══════════════════════════════════════════════════════════════════
   مركز التشغيل — رحلة المبادرة من الوصول حتى توثيق الأثر
   ملاحظة: مراحل النظام مشتقّة من حقول البيانات الفعلية
   (status: active/postponed/cancelled + completionStatus)
   ولم تُخترع حقول جديدة حفاظًا على البيانات القائمة.
   ══════════════════════════════════════════════════════════════════ */
function opsStageOf(o){
  if((o.status||'active')==='postponed') return 'postponed';
  if((o.status||'active')==='cancelled') return 'cancelled';
  if(o.completionStatus==='تم') return 'documented';          // أثر موثق
  const t = todayStr();
  if(o.date && o.date < t) return 'decide';                    // انتهت ولم تُقيَّم → يحتاج قرار
  return 'preparing';                                          // قادمة → قيد التجهيز
}
/* الانتقال للمرحلة التالية باستخدام الحقول القائمة */
function opsNextStage(o){
  const st = opsStageOf(o);
  if(st==='postponed') return {status:'active', completionStatus:'', label:'قيد التجهيز'};
  if(st==='preparing') return {status:'active', completionStatus:'', label:'يحتاج قرارًا', forceDecide:true};
  if(st==='decide')    return {status:'active', completionStatus:'تم', label:'أثر موثق'};
  return null;                                                  // موثق يبقى موثقًا
}
async function opsAdvance(id){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const nx = opsNextStage(o);
  if(!nx){ toast('المبادرة موثقة بالفعل'); return; }
  if(nx.forceDecide){ toast('المبادرة لم يحن موعدها بعد — ستنتقل تلقائيًا عند انتهائها'); return; }
  o.status = nx.status;
  if(nx.completionStatus !== undefined) o.completionStatus = nx.completionStatus;
  await saveState();
  toast(`تم نقل المبادرة إلى ${nx.label}`);
  render();
}

  const b=document.getElementById('themeToggle');
  if(b) b.innerHTML = icon(dark==='1'?'sun':'moon', 17);
}

  const nowDark = !document.body.classList.contains('dark');

}

      </div>

  }

  /* أكثر العناوين طلبًا — بدمج المتشابهة */
  const topT = (function(){
    const norm = s => String(s||'')
      .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
      .replace(/[أإآا]/g,'ا').replace(/[ىي]/g,'ي').replace(/ة/g,'ه').replace(/[ؤئء]/g,'ء')
      .replace(/[^\u0600-\u06FF0-9a-zA-Z ]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
    const stem = w => w.replace(/^(وال|بال|كال|فال|ال|و|ف|ب|ك|ل)/,'')
      .replace(/(اتها|اتهم|تها|هما|كما|ونها|انها|ات|ون|ين|ان|ها|هم|كم|نا|ية|ي|ه|ا)$/,'');
    const STOP = new Set(['في','من','علي','عن','الي','مع','و','هذا','هذه','التي','الذي','ما',

    const toks = s => [...new Set(norm(s).split(' ').map(stem).filter(w=>w.length>2 && !STOP.has(w)))];
    const sim = (a,b)=>{ const A=new Set(toks(a)), B=new Set(toks(b));

    : `<div class="empty-state" style="padding:18px;">لا توجد بيانات كافية</div>`;

  /* أين يتركز العمل؟ — حسب مسار المبادرة */

  const maxPath = Math.max(...byPath.map(x=>x.count), 1);

      <div style="flex:1;height:8px;background:#EDEAE1;border-radius:999px;overflow:hidden;">

      </div>
      <span style="flex:0 0 34px;text-align:left;font-size:12.5px;font-weight:600;color:#214445;direction:ltr;">${x.count}</span>

  const postponedBox = groups.postponed.length ? `<section class="panel fade-up delay-3" style="margin-top:18px;border-color:#E5D6C4;background:#FCF7EF;">

  /* النقر على عنوان يعرض فعالياته */

  const T = orders.length;

  const doneKeys = ['تم','لم يتم','الغيت','المشرف لا يرد',''];

  /* ── تجميع حسب المجال والمسار ── */
  const ramp = ['#8A1538','#A32348','#BC3D60','#639922','#EF9F27','#378ADD','#12A5A0'];
  const byField = (state.fields||[]).map((f,i)=>({

  /* ── بطاقات المؤشرات العليا ── */
  const cDone    = orders.filter(o=>o.completionStatus==='تم').length;
  const cPending = orders.filter(o=>!o.completionStatus && o.date && o.date < today).length;
  const cUpcoming= orders.filter(o=>o.date && o.date >= today && (o.status||'active')==='active').length;
  const cStuck   = orders.filter(o=>o.completionStatus==='المشرف لا يرد').length;

  function kpi(icon, num, label, tint, fg, unit){

  const uname = currentUser ? (currentUser.displayName || currentUser.username) : '';
  const hr = new Date().getHours();

  /* ── البطاقة الترحيبية ── */

    <div style="position:relative;z-index:1;">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#B8D1C5;">

      <p style="margin:8px 0 0;max-width:520px;font-size:13.5px;line-height:1.9;color:#B2C9C0;">

  /* ── بطاقات الإحصائيات ── */

  const curMonth = today.slice(0,7);
  const thisMonth = orders.filter(o=>(o.date||'').slice(0,7)===curMonth).length;
  const totalPeople = orders.reduce((s,o)=>s+(Number(o.participantsCount)||0),0);
  const donePct = T ? Math.round((cDone/T)*100) : 0;
  const kpiRow = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:18px;">

          <div style="font-size:11.5px;color:var(--muted-text);margin-top:2px;">${escapeHtml(label)}</div>
          ${sub?`<div style="font-size:10.5px;color:var(--soft-text);margin-top:1px;">${escapeHtml(sub)}</div>`:''}
        </div>`).join('')}
    </div>
  </div>`;

  const insight = `<section class="insight-strip fade-up delay-4">

    <div style="flex:1;min-width:0;">
      <p style="margin:0;font-size:13.5px;font-weight:600;color:#214445;">مؤشر سريع: متوسط مدة الفعالية</p>
      <p style="margin:4px 0 0;font-size:12px;line-height:1.8;color:#6F817B;">

      </p>

  /* ── لوحة المتابعة (الفكرة ب) ── */
  function colCard(o){
    const sc = state.schools.find(x=>x.id===o.schoolId);
    return `<div style="background:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:6px;">
      <div style="font-size:12.5px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(o.title)}</div>
      <div style="font-size:11px;color:#777;margin-top:2px;">${fmtDate(o.date)}${sc?' — '+escapeHtml(sc.name):''}</div>
    </div>`;
  }
  function column(title, list, tintBg, tintFg){
    const shown = list.slice(0,3).map(colCard).join('');
    const more = list.length>3 ? `<div style="text-align:center;font-size:11px;color:#888;padding:2px;">+ ${list.length-3} أخرى</div>` : '';

      ${shown || `<div style="text-align:center;font-size:11.5px;color:#999;padding:10px;">لا يوجد</div>`}${more}

  const upcoming = orders.filter(o=>o.date && o.date>=today && (o.status||'active')==='active').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const needEval = orders.filter(o=>!o.completionStatus && o.date && o.date<today).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const doneList = orders.filter(o=>o.completionStatus==='تم').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const stuck    = orders.filter(o=>['المشرف لا يرد','لم يتم','الغيت'].includes(o.completionStatus));
  const board = `<div class="card"><h2>لوحة المتابعة</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:0;">

      ${column('تحتاج تقييم', needEval, '#FAEEDA', '#412402')}
      ${column('منجزة', doneList, '#EAF3DE', '#173404')}
      ${column('متعثّرة', stuck, '#FCEBEB', '#501313')}

  /* ── جداول التوزيع بأشرطة نسبة ── */
  function breakdownCard(title, items){
    if(!items.length) return '';

  /* ── آخر الفعاليات ── */
  const recent = orders.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  const recentCard = `<div class="card"><h2>آخر الفعاليات</h2>
    ${recent.length ? `<table style="font-size:12.5px;"><thead><tr>
      <th style="width:52px;">#</th><th style="text-align:right;">الفعالية</th><th style="width:110px;">التاريخ</th><th style="width:120px;">الإنجاز</th>

/* ============ Order tables ============ */
/* Enhances a report table: wraps it for horizontal scroll, adds a toolbar with
   "reset column widths" and "toggle text wrap", and makes each column's border
   draggable to resize manually. Auto-fit-to-content is the browser default
   (table-layout:auto) and is restored any time "reset" is pressed or the table
   is re-rendered (e.g. after filtering/searching), since a fresh render has no
   inline widths. Call this once, right after inserting a <table> into `container`. */
function enhanceReportTable(container){
  if(!container) return;
  const tables = container.querySelectorAll('table');
  if(!tables.length) return;

  if(!container.querySelector('.tbl-enhance-toolbar')){
    const toolbar = document.createElement('div');
    toolbar.className = 'tbl-enhance-toolbar';
    toolbar.innerHTML = '';   // أُخفيت أزرار ضبط الأعمدة والعرض المضغوط
    toolbar.style.display = 'none';
    tables[0].parentNode.insertBefore(toolbar, tables[0]);
    const [resetBtn, wrapBtn] = toolbar.querySelectorAll('button');
    resetBtn.onclick = ()=>{ container.querySelectorAll('th').forEach(th=>{ th.style.width=''; }); };
    wrapBtn.onclick = ()=>{ container.querySelectorAll('.tbl-scroll').forEach(w=>w.classList.toggle('tbl-nowrap')); };
  }

  tables.forEach(table=>{
    if(!table.parentElement.classList.contains('tbl-scroll')){
      const scrollWrap = document.createElement('div');
      scrollWrap.className = 'tbl-scroll';
      table.parentNode.insertBefore(scrollWrap, table);
      scrollWrap.appendChild(table);
    }
    table.querySelectorAll('th').forEach(th=>{
      if(th.querySelector('.col-resizer')) return;
      const handle = document.createElement('span');
      handle.className = 'col-resizer';
      th.appendChild(handle);
      handle.addEventListener('mousedown', (e)=>{
        e.preventDefault(); e.stopPropagation();
        handle.classList.add('active');
        const startX = e.clientX, startWidth = th.offsetWidth;
        function onMove(ev){
          const delta = startX - ev.clientX; // RTL: dragging the left edge left increases width
          th.style.width = Math.max(40, startWidth + delta) + 'px';
        }
        function onUp(){
          handle.classList.remove('active');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  });
}
let __orderTableSelections = {};
function otblSelectAll(containerId, headerCheckbox){
  const container = document.getElementById(containerId);
  const rowChecks = container.querySelectorAll('.otbl-check');
  rowChecks.forEach(cb=>{ cb.checked = headerCheckbox.checked; });
  if(!__orderTableSelections[containerId]) __orderTableSelections[containerId] = new Set();
  const set = __orderTableSelections[containerId];
  set.clear();
  if(headerCheckbox.checked){ rowChecks.forEach(cb=>set.add(cb.dataset.id)); }
  const toolbar = document.getElementById(containerId+'_toolbar');
  if(toolbar){
    toolbar.querySelectorAll('.single-only').forEach(b=>{ b.disabled = set.size!==1; });
    toolbar.querySelectorAll('button.multi-ok').forEach(b=>{ b.disabled = set.size<1; });
    const select = toolbar.querySelector('.bulk-status-select');
    if(select) select.disabled = set.size<1;
  }
}
function otblSelect(containerId, checkbox){
  if(!__orderTableSelections[containerId]) __orderTableSelections[containerId] = new Set();
  const set = __orderTableSelections[containerId];
  if(checkbox.checked) set.add(checkbox.dataset.id); else set.delete(checkbox.dataset.id);
  const container = document.getElementById(containerId);
  const allChecks = container.querySelectorAll('.otbl-check');
  const headerCheckbox = container.querySelector('.otbl-check-all');
  if(headerCheckbox) headerCheckbox.checked = allChecks.length>0 && Array.from(allChecks).every(cb=>cb.checked);
  const toolbar = document.getElementById(containerId+'_toolbar');
  if(toolbar){
    toolbar.querySelectorAll('.single-only').forEach(b=>{ b.disabled = set.size!==1; });
    toolbar.querySelectorAll('button.multi-ok').forEach(b=>{ b.disabled = set.size<1; });
    const select = toolbar.querySelector('.bulk-status-select');
    if(select) select.disabled = set.size<1;
  }
}
function otblAction(containerId, action){
  const set = __orderTableSelections[containerId] || new Set();

/* حذف كل الفعاليات المحددة من جدول كل الطلبات */
async function otblBulkDelete(containerId){
  const ids = __orderTableSelections[containerId] ? Array.from(__orderTableSelections[containerId]) : [];
  if(!ids.length){ toast('حدد فعالية واحدة على الأقل'); return; }
  if(!confirm(`سيتم حذف ${ids.length} فعالية محددة نهائيًا. متابعة؟`)) return;
  state.orders = state.orders.filter(o=>!ids.includes(o.id));
  __orderTableSelections[containerId] = new Set();
  await saveState(); toast(`تم حذف ${ids.length} فعالية`); render();
}
async function otblBulkStatus(containerId){
  const set = __orderTableSelections[containerId] || new Set();
  if(set.size<1){ toast('الرجاء تحديد فعالية واحدة على الأقل'); return; }
  const select = document.getElementById(containerId+'_bulkStatus');
  const status = select.value;
  if(!status){ toast('اختر حالة الإنجاز أولًا'); return; }
  const ok = confirm(`سيتم تغيير حالة الإنجاز إلى "${status}" لعدد ${set.size} فعالية محددة. هل تريد المتابعة؟`);
  if(!ok) return;
  set.forEach(id=>{
    const o = state.orders.find(x=>x.id===id);
    if(o) o.completionStatus = status;
  });
  await saveState(); toast('تم تحديث حالة الإنجاز'); render();
}

function getWeekBounds(d){
  const dt = new Date(d+'T00:00:00');
  const dow = dt.getDay(); // 0=Sun
  const start = new Date(dt); start.setDate(dt.getDate()-dow);
  const end = new Date(start); end.setDate(start.getDate()+6);
  const fmt=(x)=>x.toISOString().slice(0,10);
  return {start:fmt(start), end:fmt(end)};
}

              title="${escapeHtml(o.title)} — ${fmtDate(o.date)}">${d}</button>`).join('')}</div>` : ''}
        </div>`;
      }).join('') || `<div class="empty-state">لا يوجد مقدمو فعاليات</div>`}
    </div>
  </div>
  </div>`;
  /* النقر على يوم يفتح أمر التكليف */
  c.querySelectorAll('.day-chip[data-open]').forEach(b=>{
    b.onclick = ()=>viewOrderReadOnly(b.dataset.open);
  });
  const opt = document.getElementById('ordPageTitle');
  if(opt){
    const ed = editingOrderId ? state.orders.find(o=>o.id===editingOrderId) : null;
    opt.textContent = orderSubTab==='new'
      ? (ed ? 'تعديل فعاليات ومبادرات — رقم '+ed.serial : 'فعاليات ومبادرات')
      : '';
  }
  /* البحث بتاريخ: يعرض فعاليات اليوم المحدد */
  const _df = document.getElementById('ord_dateFind');
  if(_df) _df.onclick = ()=>{
    openModal('البحث بتاريخ', [{name:'d', label:'اختر التاريخ', type:'date'}], v=>{
      const d = v.d;
      if(!d){ toast('اختر تاريخًا'); return false; }
      const hits = (state.orders||[]).filter(o=>{
        const s=o.date||'', e=o.dateTo||o.date||'';
        return s && d>=s && d<=e;
      }).sort((a,b)=>(a.timeFrom||'').localeCompare(b.timeFrom||''));
      const body = hits.length
        ? `<div style="max-height:340px;overflow:auto;">${hits.map(o=>{
            const sc = state.schools.find(x=>x.id===o.schoolId);
            const tn = (o.trainerIds||[]).map(id=>{const t=state.trainers.find(x=>x.id===id);return t?t.name:'';}).filter(Boolean).join('، ');
            return `<button type="button" class="activity-row" data-open="${o.id}" style="width:100%;">
              <span class="request-mark mark-teal">${icon('fileText',15)}</span>
              <span style="min-width:0;flex:1;text-align:right;">
                <span class="ar-title">${escapeHtml(o.title)}</span>
                <span class="ar-sub">${o.serial} · ${sc?escapeHtml(sc.name):'—'} · ${o.timeFrom||''}${tn?' · '+escapeHtml(tn):''}</span>
              </span>
              ${doneBadge(o.completionStatus)}
            </button>`;
          }).join('')}</div>`
        : `<div class="empty-state" style="padding:26px;">لا توجد فعاليات في ${fmtDate(d)}</div>`;
      /* نؤجّل العرض لأن openModal يُغلق النافذة بعد تنفيذ onSubmit */
      setTimeout(()=>{
        showInfoModal(`فعاليات ${fmtDate(d)} — ${hits.length} ${eventWord(hits.length)}`, body, box=>{
          box.style.maxWidth = '640px';
          box.querySelectorAll('[data-open]').forEach(b=>{
            b.onclick=()=>{ closeModal(); editOrder(b.dataset.open); };
          });
        });
      }, 60);
    });
  };
  const qf = document.getElementById('ord_quickFind'), qfr = document.getElementById('ord_quickFindRes');
  qf.addEventListener('input', ()=>{
    const q = qf.value.trim();
    if(!q){ qfr.style.display='none'; qfr.innerHTML=''; return; }
    const hits = state.orders.filter(o=> String(o.serial).includes(q) || (o.title||'').includes(q))
                             .sort((a,b)=>b.serial-a.serial).slice(0,12);
    qfr.innerHTML = hits.length ? hits.map(o=>{
      const s = state.schools.find(x=>x.id===o.schoolId);
      return `<div class="qf-item" data-id="${o.id}" style="padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--line);">
        <span class="badge">${o.serial}</span> <b>${escapeHtml(o.title)}</b>
        <div style="font-size:9pt;color:#777;">${fmtDate(o.date)}${s?' — '+escapeHtml(s.name):''}</div>
      </div>`;
    }).join('') : `<div style="padding:10px;color:#777;">لا توجد نتائج مطابقة</div>`;
    qfr.style.display='block';
    qfr.querySelectorAll('.qf-item').forEach(el=>{
      el.onmouseenter=()=>el.style.background='var(--maroon-50)';
      el.onmouseleave=()=>el.style.background='';
      el.onclick=()=>{ qfr.style.display='none'; editOrder(el.dataset.id); };
    });
  });
  document.addEventListener('click', e=>{ if(!qf.contains(e.target) && !qfr.contains(e.target)) qfr.style.display='none'; });
  document.getElementById('tabNew').onclick=()=>{orderSubTab='new'; editingOrderId=null; render();};
  document.getElementById('tabList').onclick=()=>{orderSubTab='list'; render();};
  document.getElementById('tabAdminDaily').onclick=()=>{orderSubTab='adminDaily'; render();};
  document.getElementById('tabSheet').onclick=()=>{orderSubTab='sheet'; render();};
  const sub = document.getElementById('orderSubContent');
  if(orderSubTab==='adminDaily'){
    renderAdminPage(sub);
    return;
  }
  if(orderSubTab==='sheet'){
    renderQuickEditSheet(sub);
    return;
  }
  if(orderSubTab==='list'){
    sub.innerHTML = `<div class="card"><h2>كل طلبات الفعاليات والمبادرات</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px;">
        <div class="field" style="margin:0;"><label>🔎 أمر التكليف</label><input id="ord_serialSearch" type="number" lang="en" placeholder="1234" style="width:90px;"></div>
        <div class="field" style="margin:0;"><label>🔎 اسم المدرسة</label><input id="ord_schoolSearch" placeholder="اكتب للبحث..." style="width:170px;"></div>
        <div class="field" style="margin:0;"><label>تصفية حسب</label>
          <select id="ord_filterKind" style="width:auto; min-width:140px;">
            <option value="">— اختر بندًا —</option>
            <option value="trainer">مقدم المبادرة</option>
            <option value="field">مجال المبادرة</option>
            <option value="path">مسار المبادرة</option>
            <option value="completion">الإنجاز</option>
            <option value="status">الحالة</option>
          </select>
        </div>
        <div class="field" id="ord_filterValWrap" style="margin:0; display:none;"><label>القيمة</label>
          <select id="ord_filterVal" style="width:auto; min-width:170px;"></select>
        </div>
        <div class="field" style="margin:0;"><label>الفرز</label>
          <select id="ord_sort" style="width:auto; min-width:170px;">
            <option value="soon">الأقرب للتنفيذ</option>
            <option value="dateAsc">التاريخ (الأقدم أولًا)</option>
            <option value="dateDesc">التاريخ (الأحدث أولًا)</option>
            <option value="serialDesc">رقم التكليف (تنازلي)</option>
            <option value="serialAsc">رقم التكليف (تصاعدي)</option>
          </select>
        </div>
        <button class="icon-btn" id="ord_dateFind" data-tip="البحث بتاريخ" title="البحث بتاريخ" aria-label="البحث بتاريخ" style="width:26px;height:26px;padding:0;min-width:26px;">${icon('calendar',13)}</button>
      <button class="icon-btn" id="ord_clearFilter" data-tip="مسح التصفية" title="مسح التصفية" aria-label="مسح التصفية" style="width:26px;height:26px;padding:0;min-width:26px;">${icon('x',13)}</button>
      </div>
      <div id="ord_listResult"></div></div>`;
    function optionsForKind(kind){
      if(kind==='trainer') return state.trainers.map(t=>({v:t.id, l:t.name}));
      if(kind==='field') return state.fields.map(f=>({v:f.id, l:f.name}));
      if(kind==='path') return state.programTypes.map(p=>({v:p.id, l:p.name}));
      if(kind==='completion') return [{v:'تم',l:'تم الإنجاز'},{v:'لم يتم',l:'لم يتم الإنجاز'},{v:'الغيت',l:'أُلغيت'},{v:'المشرف لا يرد',l:'المشرف لا يرد'},{v:'__pending',l:'لم تنجز بعد'}];
      if(kind==='status') return [{v:'active',l:'نشطة'},{v:'cancelled',l:'ملغاة'},{v:'postponed',l:'مؤجّلة'}];
      return [];
    }
    document.getElementById('ord_filterKind').addEventListener('change', e=>{
      const kind=e.target.value, wrap=document.getElementById('ord_filterValWrap'), sel=document.getElementById('ord_filterVal');
      if(!kind){ wrap.style.display='none'; sel.innerHTML=''; drawFiltered(); return; }
      // تُبنى قائمة القيم عند الطلب فقط لتخفيف الواجهة
      sel.innerHTML = '<option value="">الكل</option>' + optionsForKind(kind).map(o=>`<option value="${escapeHtml(o.v)}">${escapeHtml(o.l)}</option>`).join('');
      wrap.style.display=''; drawFiltered();
    });
    document.getElementById('ord_filterVal').addEventListener('change', ()=>drawFiltered());
    document.getElementById('ord_clearFilter').onclick=()=>{
      document.getElementById('ord_filterKind').value='';
      document.getElementById('ord_filterValWrap').style.display='none';
      document.getElementById('ord_filterVal').innerHTML='';
      document.getElementById('ord_serialSearch').value='';
      document.getElementById('ord_schoolSearch').value='';
      drawFiltered();
    };
    function drawFiltered(){
      const serialQ = document.getElementById('ord_serialSearch').value.trim();
      const q = document.getElementById('ord_schoolSearch').value.trim();
      const kind = document.getElementById('ord_filterKind').value;
      const val  = document.getElementById('ord_filterVal').value || '';
      const trainerFilter    = kind==='trainer' ? val : '';
      const fieldFilter      = kind==='field' ? val : '';
      const pathFilter       = kind==='path' ? val : '';
      const completionFilter = kind==='completion' ? val : '';
      const statusFilter     = kind==='status' ? val : '';
      const sortMode = (document.getElementById('ord_sort')||{}).value || 'soon';
      const today = todayStr();
      let list = state.orders.slice().sort((a,b)=>{
        if(sortMode==='dateAsc')   return (a.date||'').localeCompare(b.date||'');
        if(sortMode==='dateDesc')  return (b.date||'').localeCompare(a.date||'');
        if(sortMode==='serialAsc') return (a.serial||0)-(b.serial||0);
        if(sortMode==='serialDesc')return (b.serial||0)-(a.serial||0);
        /* الأقرب للتنفيذ: القادمة أولًا بترتيب تصاعدي، ثم الماضية بالأحدث */
        const aF = (a.date||'') >= today, bF = (b.date||'') >= today;
        if(aF !== bF) return aF ? -1 : 1;
        return aF ? (a.date||'').localeCompare(b.date||'')
                  : (b.date||'').localeCompare(a.date||'');
      });
      if(serialQ){ list = list.filter(o=>String(o.serial).includes(serialQ)); }
      if(q){ list = list.filter(o=>{ const s=state.schools.find(x=>x.id===o.schoolId); return s && s.name.includes(q); }); }
      if(trainerFilter){ list = list.filter(o=>(o.trainerIds||[]).includes(trainerFilter)); }
      if(fieldFilter){ list = list.filter(o=>o.fieldId===fieldFilter); }
      if(pathFilter){ list = list.filter(o=>o.programTypeId===pathFilter); }
      if(completionFilter){
        list = list.filter(o=> completionFilter==='__pending' ? !o.completionStatus : o.completionStatus===completionFilter);
      }
      if(statusFilter){ list = list.filter(o=>(o.status||'active')===statusFilter); }
      const box = document.getElementById('ord_listResult');
      box.innerHTML = ordersTableHtml(list, 'otbl_order_list');
      enhanceReportTable(box);
    }
    ['ord_serialSearch','ord_schoolSearch'].forEach(id=>document.getElementById(id).addEventListener('input', drawFiltered));
    document.getElementById('ord_sort').addEventListener('change', drawFiltered);
    drawFiltered();
    return;
  }
  renderOrderForm(sub);
}

/* ============ جدول تعديل سريع (بشكل إكسل) ============ */
function renderQuickEditSheet(sub){
  sub.innerHTML = `<div class="card">

    </details>

      <div class="field"><label>🔎 أمر التكليف</label><input id="qs_serial" type="number" lang="en" placeholder="رقم..."></div>
      <div class="field"><label>🔎 العنوان / المدرسة</label><input id="qs_search" placeholder="اكتب للبحث..."></div>
      <div class="field"><label>مجال المبادرة</label><select id="qs_fFilter"><option value="">الكل</option>${state.fields.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}</select></div>
      <div class="field"><label>مسار المبادرة</label><select id="qs_pFilter"><option value="">الكل</option>${state.programTypes.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>مكان التنفيذ</label><select id="qs_placeFilter"><option value="">الكل</option>${state.placeTypes.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>المرحلة الدراسية</label><select id="qs_levelFilter"><option value="">الكل</option>${LOCATION_TYPES.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('')}</select></div>
      <div class="field"><label>🔍 بحث عن الفراغات في</label><select id="qs_emptyFilter">
        <option value="">— بدون —</option>
        <option value="fieldId">مجال المبادرة</option>
        <option value="programTypeId">مسار المبادرة</option>
        <option value="date">تاريخ المبادرة من</option>
        <option value="dateTo">تاريخ الانتهاء</option>
        <option value="timeFrom">وقت المبادرة من</option>
        <option value="timeTo">وقت المبادرة إلى</option>
        <option value="participantsCount">عدد المستهدفين</option>
        <option value="title">عنوان المبادرة</option>
        <option value="placeType">مكان التنفيذ</option>
        <option value="schoolId">مكان المبادرة</option>
        <option value="supervisorId">المشرف</option>
        <option value="supPhone">رقم الجوال</option>
        <option value="trainerIds">المدربون</option>
      </select></div>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
      <select id="qs_bulkField" disabled style="width:auto;">
        <option value="">-- تعديل مجال المبادرة للمحدد --</option>
        ${state.fields.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}
      </select>
      <button class="icon-btn rect" id="qs_bulkApply" disabled data-tip="تطبيق المجال" title="تطبيق المجال">✅</button>
      <span style="border-right:1.5px solid var(--line); height:24px; margin:0 4px;"></span>
      <select id="qs_bulkPath" disabled style="width:auto;">
        <option value="">-- تعديل مسار المبادرة للمحدد --</option>
        ${state.programTypes.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
      </select>
      <button class="icon-btn rect" id="qs_bulkApplyPath" disabled data-tip="تطبيق المسار" title="تطبيق المسار">✅</button>
      <span style="border-right:1.5px solid var(--line); height:24px; margin:0 4px;"></span>
      <button class="icon-btn rect danger" id="qs_bulkDelete" disabled data-tip="حذف المحدد" title="حذف المحدد" aria-label="حذف المحدد">${icon('trash',17)}</button>
    </div>
    <div id="qs_tableWrap" class="tbl-scroll"></div>
  </div>`;

  const selectedIds = new Set();

  /* ===== لصق مدخلات من إكسل/نص ===== */
  let pastedRows = [];
  function parsePasted(){
    const raw = document.getElementById('qs_paste').value;
    const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const out = [];
    lines.forEach(line=>{
      // يفصل بالتاب (اللصق من إكسل) وإلا بالفاصلة
      const cells = (line.includes('\t') ? line.split('\t') : line.split(/[,،]/)).map(c=>c.trim());
      const title = cells[0]||'';
      if(!title) return;
      // تجاهل صف العناوين إن لُصق معها
      if(title==='عنوان المبادرة') return;
      out.push({
        title, date:cells[1]||'', timeFrom:cells[2]||'', timeTo:cells[3]||'',
        schoolName:cells[4]||'', participantsCount:cells[5]||'', ptypeName:cells[6]||'',
        trainersRaw:cells[7]||'', supName:cells[8]||'', supPhone:cells[9]||''
      });
    });
    return out;
  }
  document.getElementById('qs_pasteParse').onclick = ()=>{
    pastedRows = parsePasted();
    const box = document.getElementById('qs_pastePreview');
    if(!pastedRows.length){
      box.innerHTML = `<div class="empty-state">لم يتم التعرّف على أي صف — تأكد من اللصق ومن ترتيب الأعمدة</div>`;
      document.getElementById('qs_pasteApply').disabled = true;
      return;
    }
    box.innerHTML = `<div class="helper" style="margin-bottom:6px;">تم التعرّف على <b>${pastedRows.length}</b> صفًا — راجعها ثم اضغط "إضافة للجدول":</div>
      <div class="tbl-scroll"><table><thead><tr><th>العنوان</th><th>التاريخ</th><th>من</th><th>إلى</th><th>المدرسة</th><th>المستهدفون</th><th>المسار</th><th>المدربون</th><th>المشرف</th><th>الجوال</th></tr></thead><tbody>
        ${pastedRows.map(r=>`<tr><td>${escapeHtml(r.title)}</td><td>${escapeHtml(r.date)}</td><td>${escapeHtml(r.timeFrom)}</td><td>${escapeHtml(r.timeTo)}</td><td>${escapeHtml(r.schoolName)}</td><td>${escapeHtml(r.participantsCount)}</td><td>${escapeHtml(r.ptypeName)}</td><td>${escapeHtml(r.trainersRaw)}</td><td>${escapeHtml(r.supName)}</td><td>${escapeHtml(r.supPhone)}</td></tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById('qs_pasteApply').disabled = false;
  };
  document.getElementById('qs_pasteApply').onclick = async ()=>{
    if(!pastedRows.length){ toast('اضغط "معاينة" أولًا'); return; }
    const markDone = document.getElementById('qs_pasteDone').checked;
    const normT = s => (s||'').toString().trim().replace(/\s+/g,' ');
    let added=0, skipped=0;
    pastedRows.forEach(r=>{
      let sch = state.schools.find(s=>s.name===r.schoolName);
      // منع التكرار: نفس العنوان والتاريخ والمدرسة
      if(state.orders.some(o=>normT(o.title)===normT(r.title) && o.date===r.date && sch && o.schoolId===sch.id)){ skipped++; return; }
      if(!sch && r.schoolName){ sch={id:uid(), name:r.schoolName, level:'غير ذلك', email:'', supervisors:[]}; state.schools.push(sch); }

      let programTypeId = state.programTypes[0]?state.programTypes[0].id:'';
      if(r.ptypeName){
        let pt = state.programTypes.find(p=>p.name===r.ptypeName);
        if(!pt){ pt={id:uid(), name:r.ptypeName}; state.programTypes.push(pt); }
        programTypeId = pt.id;
      }
      const trainerIds = [];
      if(r.trainersRaw){
        r.trainersRaw.split(/[،,]/).map(s=>s.trim()).filter(Boolean).forEach(entry=>{
          const [nm, ph] = entry.split(':').map(s=>s?s.trim():'');
          const name = nm||entry;
          let tr = state.trainers.find(t=> (ph && t.phone===ph) || t.name===name);
          if(!tr){ tr={id:uid(), name, phone:ph||''}; state.trainers.push(tr); }
          trainerIds.push(tr.id);
        });
      }
      let supervisorId='';
      if(sch && (r.supName || r.supPhone)){
        let sv = sch.supervisors.find(x=>(r.supPhone && x.phone===r.supPhone) || (r.supName && x.name===r.supName));
        if(!sv){ sv={id:uid(), name:r.supName||'مشرف (بدون اسم)', phone:r.supPhone, email:''}; sch.supervisors.push(sv); }
        supervisorId = sv.id;
      }
      const yr = (r.date || todayStr()).slice(0,4);
      const maxSerial = state.orders.filter(o=>o.date && o.date.slice(0,4)===yr).reduce((m,o)=>Math.max(m,o.serial||0),0);
      state.orders.push({
        id:uid(), serial:maxSerial+1, createdAt:Date.now(), title:r.title,
        fieldId: state.fields[0]?state.fields[0].id:'', participantsCount:r.participantsCount,
        date:r.date, dateTo:r.date, timeFrom:r.timeFrom, timeTo:r.timeTo, programTypeId,
        schoolId: sch?sch.id:'', supervisorId, trainerIds, requesterNote:'', adminNote:'مُدخل باللصق',
        adminRequests:[], completionStatus: markDone?'تم':'', notDoneReason:'', supervisorRating:0,
        schoolRating:0, studentsRating:0, recommendSchool:'', evaluatedBy:'', status:'active'
      });
      added++;
    });
    await saveState();
    toast(`تمت إضافة ${added} فعالية${skipped?` — تم تجاهل ${skipped} مكررة`:''}`);
    document.getElementById('qs_paste').value=''; document.getElementById('qs_pastePreview').innerHTML='';

    if(selectedIds.size<1){ toast('حدد فعالية واحدة على الأقل'); return; }

  document.getElementById('qs_bulkApplyPath').onclick = async ()=>{

  function draw(){
    const q = document.getElementById('qs_search').value.trim();
